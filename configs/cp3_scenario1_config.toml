# Challenge scenario 1, with addresses verified against generated network.html.
# Racetunnel and Gorilla share a comparison class. Detector source is unchanged.
# All client subnets in this scenario have NAT disabled.
# Iodine/DNS is inventoried separately and is excluded from these scores.

[scenario]
name = "topspin_challenge_1_ixp"
chunks = ["ixp-router"]

[topology]
client_nets = ["10.1.0.0/16"]
peer_nets = ["10.2.0.0/24"]

[topology.service_nets]
"10.5.5.0/24" = "minio"
"10.3.3.0/24" = "mastodon"

[topology.peer_service_ports]
# Class names select the benign baselines used for divergence comparisons.
# Service subnet mappings above take precedence over these port mappings.
443 = "gorilla" # Racetunnel; compare against benign Gorilla on port 8080.
2121 = "ftp" # FTP TGEN control connections.
6697 = "irc"
8080 = "gorilla" # Benign Gorilla TGEN (WebSocket over TLS).
8675 = "obfs4" # No benign baseline in this capture; divergence scores are n/a.
# This scenario does not configure dedicated TLS TGEN clients.

[[covert]]
name = "racetunnel-1"
host = "10.1.1.4"
service = "10.2.0.4"
port = 443
role = "Alice 1: direct tunnel"

[[covert]]
name = "racetunnel-2"
host = "10.1.1.5"
service = "10.2.0.5"
port = 443
role = "Alice 2: direct tunnel"

[[covert]]
name = "skyhook-3"
host = "10.1.4.4"
service = "10.5.5.3"
port = 8443
role = "Alice 3: sender"

[[covert]]
name = "skyhook-3-bob"
host = "10.2.0.6"
service = "10.5.5.3"
port = 8443
role = "Bob paired with Alice 3: receiver"

[[covert]]
name = "skyhook-4"
host = "10.1.4.5"
service = "10.5.5.3"
port = 8443
role = "Alice 4: sender"

[[covert]]
name = "skyhook-4-bob"
host = "10.2.0.7"
service = "10.5.5.3"
port = 8443
role = "Bob paired with Alice 4: receiver"

[[covert]]
name = "obfs4-5"
host = "10.1.3.4"
service = "10.2.0.8"
port = 8675
role = "Alice 5: direct tunnel"

[[covert]]
name = "obfs4-6"
host = "10.1.3.5"
service = "10.2.0.9"
port = 8675
role = "Alice 6: direct tunnel"

[[covert]]
name = "mastodon-9"
host = "10.1.0.4"
service = "10.3.3.3"
port = 443
role = "Alice 9: sender"

[[covert]]
name = "mastodon-9-bob"
host = "10.2.0.10"
service = "10.3.3.3"
port = 443
role = "Bob paired with Alice 9: receiver"

[pipeline]
min_session_packets = 40
payload_prefix_bytes = 8192
first_segment_bytes = 64
payload_ports = [8443] # Extra payload ports; peer/covert ports are included automatically.
